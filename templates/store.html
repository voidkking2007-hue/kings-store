<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KING’S STORE - Roblox Scripts</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
body { background-color: #08070c; color: #f3foff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
header { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; padding: 20px; }
.logo { font-size: 24px; font-weight: 900; color: #c084fc; text-shadow: 0 0 12px rgba(168, 85, 247, 0.6); }
.badge { background: #5865F2; color: #ffffff; padding: 8px 16px; border-radius: 20px; text-decoration: none; font-weight: bold; font-size: 14px; box-shadow: 0 0 15px rgba(88, 101, 242, 0.4); }
.badge:hover { background: #4752C4; box-shadow: 0 0 15px rgba(88, 101, 242, 0.8); }
.main-container { width: 100%; max-width: 900px; padding: 20px; }
h1 { font-size: 28px; margin-bottom: 10px; color: #ffffff; }
h1 span { color: #a855f7; text-shadow: 0 0 12px rgba(168, 85, 247, 0.6); }
.subtitle { color: #9ca3af; margin-bottom: 30px; font-size: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
.card { background: #110e1b; border: 1px solid #281e3d; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 0 15px rgba(168, 85, 247, 0.1); }
.card:hover { border-shadow: 0 0 15px rgba(168, 85, 247, 0.4); transition: 0.3s; }
.card-title { font-size: 18px; font-weight: bold; color: #f3foff; margin-bottom: 8px; }
.card-cat { font-size: 11px; text-transform: uppercase; background: #1c142d; color: #c084fc; padding: 4px 8px; border-radius: 6px; width: fit-content; margin-bottom: 12px; }
.card-desc { font-size: 13px; color: #9ca3af; margin-bottom: 20px; line-height: 1.4; }
.card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #281e3d; padding-top: 15px; }
.price { font-weight: bold; color: #e879f9; font-size: 16px; text-shadow: 0 0 8px rgba(232, 121, 249, 0.4); }
.btn-buy { background: linear-gradient(135deg, #a855f7, #9333ea); color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; text-decoration: none; font-size: 14px; }
.btn-buy:hover { background: linear-gradient(135deg, #a855f7, #7e22ce); box-shadow: 0 0 10px rgba(168, 85, 247, 0.6); }
</style>
</head>
<body>
<header>
<div class="logo">KING’S STORE</div>
<a href="https://discord.gg/sdpE96QUb" target="_blank" class="badge">DISCORD SERVER</a>
</header>
<div class="main-container">
<h1>Script Marketplace. <span>Secure & Fast.</span></h1>
<p class="subtitle">Achiziționează scripturi profesionale optimizate.</p>
<div class="grid">
{% for script in scripts %}
<div class="card">
<div>
<span class="card-cat">{{ script.category }}</span>
<div class="card-title">{{ script.title }}</div> <!-- AICI AM ADĂUGAT LINIA LIPSĂ! -->
<div class="card-desc">{{ script.description }}</div> <!-- AICI AM ADĂUGAT LINIA LIPSĂ! -->
</div>
<div class="card-footer">
<span class="price">{{ script.price }}</span>
<a href="{{ script.link }}" target="_blank" class="btn-buy">CUMPĂRĂ</a>
</div>
</div>
{% endfor %}
</div>
</div>
</body>
</html>
