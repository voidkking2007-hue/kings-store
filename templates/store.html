<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KING'S STORE - Roblox Scripts</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #08070c; color: #f3f0ff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        header { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid #231b36; margin-bottom: 30px; }
        .logo { font-size: 24px; font-weight: 900; color: #c084fc; text-shadow: 0 0 12px rgba(192, 132, 252, 0.7); letter-spacing: 2px; }
        .badge { background: #5865F2; color: #ffffff; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: bold; text-decoration: none; box-shadow: 0 0 10px rgba(88, 101, 242, 0.5); transition: 0.2s; }
        .badge:hover { background: #4752C4; box-shadow: 0 0 15px rgba(88, 101, 242, 0.8); }
        .main-container { width: 100%; max-width: 900px; }
        h1 { font-size: 28px; margin-bottom: 10px; color: #ffffff; }
        h1 span { color: #a855f7; text-shadow: 0 0 12px rgba(168, 85, 247, 0.6); }
        .subtitle { color: #9ca3af; margin-bottom: 30px; font-size: 14px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .card { background: #110e1b; border: 1px solid #281e3d; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; transition: all 0.3s ease; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
        .card:hover { border-color: #a855f7; box-shadow: 0 0 15px rgba(168, 85, 247, 0.4); transform: translateY(-3px); }
        .card-title { font-size: 18px; font-weight: bold; margin-bottom: 8px; color: #f3f0ff; }
        .card-cat { font-size: 11px; text-transform: uppercase; background: #1c142d; color: #c084fc; padding: 4px 10px; border-radius: 6px; display: inline-block; margin-bottom: 12px; border: 1px solid #382859; font-weight: 600; }
        .card-desc { font-size: 13px; color: #9ca3af; margin-bottom: 20px; line-height: 1.4; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #231b36; padding-top: 15px; }
        .price { font-weight: bold; color: #e879f9; font-size: 16px; text-shadow: 0 0 8px rgba(232, 121, 249, 0.4); }
        .btn-buy { background: linear-gradient(135deg, #9333ea, #6b21a8); color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; text-decoration: none; font-size: 13px; box-shadow: 0 0 12px rgba(147, 51, 234, 0.5); transition: 0.2s; }
        .btn-buy:hover { background: linear-gradient(135deg, #a855f7, #7e22ce); box-shadow: 0 0 18px rgba(168, 85, 247, 0.8); }
    </style>
</head>
<body>
    <header>
        <div class="logo">KING'S STORE</div>
        <a href="https://discord.gg/dgUp2hUqH" target="_blank" class="badge">DISCORD SERVER</a>
    </header>
    <div class="main-container">
        <h1>Script Marketplace. <span>Secure & Fast.</span></h1>
        <p class="subtitle">Achiziționează scripturi profesionale optimizate.</p>

        <div class="grid">
            {% for script in scripts %}
            <div class="card">
                <div>
                    <span class="card-cat">{{ script.category }}</span>
                    <div class="card-title">{{ script.title }}</div>
                    <div class="card-desc">{{ script.description }}</div>
                </div>
                <div class="card-footer">
                    <span class="price">{{ script.price }}</span>
                    <a href="{{ script.link }}" target="_blank" class="btn-buy">CUMPĂRĂ</a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
