<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KING’S STORE - Roblox Scripts</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
body { background-color: #000000; color: #ffffff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
header { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; padding: 20px; }
.logo { font-size: 24px; font-weight: 900; color: #c084fc; text-shadow: 0 0 12px rgba(168, 85, 247, 0.6); }
.badge { background: #ffffff; color: #000000; padding: 8px 16px; border-radius: 20px; text-decoration: none; font-weight: bold; font-size: 14px; box-shadow: 0 0 15px rgba(255, 255, 255, 0.4); }
.badge:hover { background: #dddddd; }
.main-container { width: 100%; max-width: 900px; padding: 20px; }
h1 { font-size: 28px; margin-bottom: 10px; color: #ffffff; }
h1 span { color: #c084fc; text-shadow: 0 0 12px rgba(168, 85, 247, 0.6); }
.subtitle { color: #ffffff; margin-bottom: 30px; font-size: 14px; opacity: 0.8; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
.card { background: #08070c; border: 1px solid #222222; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 0 10px rgba(168, 85, 247, 0.1); }
.card-title { font-size: 18px; font-weight: bold; color: #c084fc; margin-bottom: 8px; }
.card-cat { font-size: 11px; text-transform: uppercase; background: #222222; color: #ffffff; padding: 4px 8px; border-radius: 6px; width: fit-content; margin-bottom: 12px; opacity: 0.7; }
.card-desc { font-size: 13px; color: #ffffff; margin-bottom: 20px; line-height: 1.4; }
.card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #222222; padding-top: 15px; }
.price { font-weight: bold; color: #c084fc; font-size: 16px; }
.btn-buy { background: #c084fc; color: #000000; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; text-decoration: none; font-size: 14px; }
.btn-buy:hover { background: #d8b4fe; box-shadow: 0 0 10px rgba(192, 132, 252, 0.6); }
</style>
</head>
<body>
<header>
<div class="logo">KING’S STORE</div>
<a href="https://discord.gg/sdpE96QUb" target="_blank" class="badge">DISCORD SERVER</a>
</header>
<div class="main-container">
<h1>Script Marketplace. <span>Secure & Fast.</span></h1>
<p class="subtitle">Achiziționează scripturi profesionale optimizate.</p>
<div class="grid">
{% for script in scripts %}
<div class="card">
<div>
<span class="card-cat">{{ script.category }}</span>
<div class="card-title">{{ script.title }}</div>
<div class="card-desc">{{ script.description }}</div>
</div>
<div class="card-footer">
<span class="price">{{ script.price }}</span>
<a href="{{ script.link }}" target="_blank" class="btn-buy">CUMPĂRĂ</a>
</div>
</div>
{% endfor %}
</div>
</div>
</body>
</html>
